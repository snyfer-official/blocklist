name: Report a domain
description: Request a false-positive correction or report a missing risky domain.
title: '[Domain report] '
body:
  - type: markdown
    attributes:
      value: 'Reports are public. Include only the domain and non-sensitive evidence. Never include passwords, private URLs, account details or personal documents.'
  - type: input
    id: domain
    attributes:
      label: Domain
      placeholder: example.com
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Remove a wrongly listed domain
        - Review a missing risky domain
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Explanation and public evidence
      description: Explain the issue without including sensitive information.
    validations:
      required: true
